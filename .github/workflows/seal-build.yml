name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml -> npm test).
# Reproduces the org.webjars.npm:xmldom WebJar: the npm package's files under
# META-INF/resources/webjars/xmldom/<version>/ plus the WebJar Sync pom files.
on:
  workflow_dispatch: {}

jobs:
  webjar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # npm <= 6 always packs `changelog` despite .npmignore, as the 0.1.31 tarball does.
      - uses: actions/setup-node@v4
        with:
          node-version: '12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: npm pack
        run: |
          npm --version
          npm pack
          ls -l xmldom-*.tgz

      - name: Assemble WebJar
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          STAGING="$RUNNER_TEMP/webjar"
          rm -rf "$STAGING" "$RUNNER_TEMP/pkg"
          mkdir -p "$RUNNER_TEMP/pkg" "$STAGING/META-INF/resources/webjars/xmldom/$VERSION" "$STAGING/META-INF/maven/org.webjars.npm/xmldom"
          tar xzf "xmldom-$VERSION.tgz" -C "$RUNNER_TEMP/pkg"
          cp -a "$RUNNER_TEMP/pkg/package/." "$STAGING/META-INF/resources/webjars/xmldom/$VERSION/"
          cp .github/seal/pom.xml .github/seal/pom.properties "$STAGING/META-INF/maven/org.webjars.npm/xmldom/"
          mkdir -p dist
          (cd "$STAGING" && jar cMf "$GITHUB_WORKSPACE/dist/xmldom-$VERSION.jar" META-INF)
          unzip -l "dist/xmldom-$VERSION.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: xmldom-webjar
          path: dist/xmldom-*.jar
          if-no-files-found: error
